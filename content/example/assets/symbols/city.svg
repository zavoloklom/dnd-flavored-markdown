<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc" color="#BBA273">
    <title>Город — эмблема замка</title>
    <desc>Монохромный силуэт средневекового замка с башнями и зубцами, квадратный формат</desc>

    <!-- Маска вырезает ворота и бойницы (прозрачные) -->
    <defs>
        <mask id="cutouts">
            <!-- фон маски чёрный = полностью прозрачный -->
            <rect x="0" y="0" width="1024" height="1024" fill="black"/>

            <!-- Силуэт замка: белый = видимая часть -->
            <g fill="white">
                <!-- Левая башня -->
                <rect x="172" y="360" width="120" height="460"/>
                <!-- Правая башня -->
                <rect x="732" y="360" width="120" height="460"/>
                <!-- Центральный донжон -->
                <rect x="412" y="300" width="224" height="180"/>
                <!-- Главная стена -->
                <rect x="232" y="480" width="560" height="340"/>

                <!-- Зубцы на стене -->
                <rect x="252" y="440" width="48" height="40"/>
                <rect x="324" y="440" width="48" height="40"/>
                <rect x="396" y="440" width="48" height="40"/>
                <rect x="568" y="440" width="48" height="40"/>
                <rect x="640" y="440" width="48" height="40"/>
                <rect x="712" y="440" width="48" height="40"/>

                <!-- Зубцы на башнях -->
                <rect x="172" y="320" width="28" height="40"/>
                <rect x="208" y="320" width="28" height="40"/>
                <rect x="244" y="320" width="28" height="40"/>
                <rect x="280" y="320" width="28" height="40"/>

                <rect x="732" y="320" width="28" height="40"/>
                <rect x="768" y="320" width="28" height="40"/>
                <rect x="804" y="320" width="28" height="40"/>
                <rect x="840" y="320" width="28" height="40"/>

                <!-- Зубцы на донжоне -->
                <rect x="412" y="260" width="28" height="40"/>
                <rect x="456" y="260" width="28" height="40"/>
                <rect x="500" y="260" width="28" height="40"/>
                <rect x="544" y="260" width="28" height="40"/>
                <rect x="608" y="260" width="28" height="40"/>
            </g>

            <!-- Вырез: арочные ворота -->
            <path fill="black" d="M452 820V652a60 60 0 0 1 120 0V820Z"/>

            <!-- Вырезы: узкие бойницы -->
            <rect x="228" y="560" width="16" height="80" fill="black"/>
            <rect x="308" y="560" width="16" height="80" fill="black"/>
            <rect x="708" y="560" width="16" height="80" fill="black"/>
            <rect x="788" y="560" width="16" height="80" fill="black"/>
            <rect x="508" y="340" width="12" height="64" fill="black"/>
            <rect x="528" y="340" width="0" height="0" fill="black"/>
        </mask>
    </defs>

    <!-- Заливка знаком: цвет берётся из currentColor; маска делает отверстия -->
    <rect x="0" y="0" width="1024" height="1024" fill="currentColor" mask="url(#cutouts)"/>
</svg>
