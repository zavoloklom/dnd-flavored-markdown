<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc" color="#BBA273">
    <title>СМГ — символ (магический сигил)</title>
    <desc>Кольцо из 12 звёзд, внутренний круг и центральный треугольник с точкой</desc>

    <!-- Пятиконечная звезда -->
    <defs>
        <polygon id="star" points="0,-28 8.2,-8.7 29.8,-9.1 12,3.5 18.2,24.3 0,12.8 -18.2,24.3 -12,3.5 -29.8,-9.1 -8.2,-8.7"/>
    </defs>

    <!-- Внутренний круг -->
    <circle cx="512" cy="512" r="200" fill="none" stroke="currentColor" stroke-width="8"/>

    <!-- Кольцо из 12 звёзд -->
    <g fill="currentColor" transform="translate(512,512)">
        <g id="starPos"><use href="#star" transform="translate(0,-320)"/></g>
        <use href="#starPos" transform="rotate(30)"/>
        <use href="#starPos" transform="rotate(60)"/>
        <use href="#starPos" transform="rotate(90)"/>
        <use href="#starPos" transform="rotate(120)"/>
        <use href="#starPos" transform="rotate(150)"/>
        <use href="#starPos" transform="rotate(180)"/>
        <use href="#starPos" transform="rotate(210)"/>
        <use href="#starPos" transform="rotate(240)"/>
        <use href="#starPos" transform="rotate(270)"/>
        <use href="#starPos" transform="rotate(300)"/>
        <use href="#starPos" transform="rotate(330)"/>
    </g>

    <!-- Центральный магический сигил -->
    <g fill="none" stroke="currentColor" stroke-width="12" stroke-linejoin="miter" stroke-linecap="butt">
        <!-- Равносторонний треугольник, вписанный в круг r=200 -->
        <path d="M512 392 L408.077 572 L615.923 572 Z"/>
        <!-- Малая сфера (сила/эссенция) -->
        <circle cx="512" cy="512" r="24" fill="currentColor"/>
    </g>
</svg>
