<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc" color="#BBA273">
    <title>Солнце — эмблема</title>
    <desc>Круг с чередующимися лучами, монохром, квадратный формат</desc>

    <!-- Параметры: радиус круга rc, длины лучей rLong/rShort -->
    <defs>
        <!-- Длинный луч, направлен вверх (дальше — повороты вокруг центра 512,512) -->
        <polygon id="ray-long" points="512,52  592,292  432,292" fill="currentColor"/>
        <!-- Короткий луч -->
        <polygon id="ray-short" points="512,132  572,292  452,292" fill="currentColor"/>
    </defs>

    <!-- Лучи: 16 штук, чередование длинных и коротких -->
    <g>
        <!-- Длинные: каждые 45° -->
        <use href="#ray-long" transform="rotate(0 512 512)"/>
        <use href="#ray-long" transform="rotate(45 512 512)"/>
        <use href="#ray-long" transform="rotate(90 512 512)"/>
        <use href="#ray-long" transform="rotate(135 512 512)"/>
        <use href="#ray-long" transform="rotate(180 512 512)"/>
        <use href="#ray-long" transform="rotate(225 512 512)"/>
        <use href="#ray-long" transform="rotate(270 512 512)"/>
        <use href="#ray-long" transform="rotate(315 512 512)"/>

        <!-- Короткие: смещение на 22.5° -->
        <use href="#ray-short" transform="rotate(22.5 512 512)"/>
        <use href="#ray-short" transform="rotate(67.5 512 512)"/>
        <use href="#ray-short" transform="rotate(112.5 512 512)"/>
        <use href="#ray-short" transform="rotate(157.5 512 512)"/>
        <use href="#ray-short" transform="rotate(202.5 512 512)"/>
        <use href="#ray-short" transform="rotate(247.5 512 512)"/>
        <use href="#ray-short" transform="rotate(292.5 512 512)"/>
        <use href="#ray-short" transform="rotate(337.5 512 512)"/>
    </g>

    <!-- Центральный диск -->
    <circle cx="512" cy="512" r="220" fill="currentColor"/>
</svg>
